AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Bridge AAC backend — /expand, /simplify, /speak, /profile/{id}, and /context/update

Globals:
  Function:
    Runtime: python3.12
    Timeout: 25
    MemorySize: 128

Resources:
  BridgeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'OPTIONS,POST,GET'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  ProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: profileId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ExpandFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.expand.app.lambda_handler
      Environment:
        Variables:
          # ExpandFunction now also reads a saved profile override before falling back to the
          # fixture (see common/dynamo.py) -- without this, PROFILE_TABLE_NAME would resolve to
          # config.py's local-dev default, miss every lookup, and silently always use the fixture.
          PROFILE_TABLE_NAME: !Ref ProfileTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Region hardcoded to match src/common/config.py's AWS_REGION — this stack must be
                # deployed to us-east-1. Using ${AWS::Region} here would silently break if ever
                # deployed elsewhere: the Lambda would still call Bedrock in us-east-1 (per config.py)
                # while this policy would only grant access in the deploy region.
                - !Sub "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                # Underlying foundation model, wildcarded across regions: AWS requires IAM permission
                # on the foundation model in every region a cross-region profile might route to, not
                # just the invoking region.
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ProfileTable.Arn
      Events:
        Expand:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /expand
            Method: post

  SimplifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.simplify.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Same policy as ExpandFunction (identical model/account/region constraints).
                # Globals.Function does not support Policies (checked against AWS's SAM Globals
                # reference), so this has to be duplicated rather than hoisted up.
                - !Sub "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
      Events:
        Simplify:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /simplify
            Method: post

  SpeakFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.speak.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              # Polly has no per-voice/per-request ARNs to scope to (unlike Bedrock's
              # inference-profile/foundation-model ARNs above) -- "*" is the standard/expected
              # scope for polly:SynthesizeSpeech.
              Resource: "*"
      Events:
        Speak:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /speak
            Method: post

  ContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.context.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Same policy as SimplifyFunction (identical model/account/region constraints).
                - !Sub "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
      Events:
        UpdateContext:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /context/update
            Method: post

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.profile.app.lambda_handler
      Environment:
        Variables:
          PROFILE_TABLE_NAME: !Ref ProfileTable
      Policies:
        # Explicit least-privilege statement rather than DynamoDBCrudPolicy, which also grants
        # Scan/Query/UpdateItem/DeleteItem/BatchWrite that this endpoint never uses.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileTable.Arn
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /profile/{id}
            Method: get
        PutProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /profile/{id}
            Method: post
