AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Bridge AAC backend — /expand, /simplify, /speak, /profile/{id}, /context/update, plus the CloudFront-fronted static site

Parameters:
  SiteUsername:
    Type: String
    Default: pebble
  SitePassword:
    Type: String
    NoEcho: true
  ApiOriginSecret:
    Type: String
    NoEcho: true
    Description: >
      Shared secret CloudFront injects on every request to the API origin; the Lambdas reject
      anything missing/wrong via common/origin_guard.py so the raw execute-api URL can't be used
      to bypass the CloudFront Basic-auth gate.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 25
    MemorySize: 128
    Environment:
      Variables:
        ORIGIN_SECRET: !Ref ApiOriginSecret

Resources:
  BridgeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'OPTIONS,POST,GET'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  ProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: profileId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ExpandFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build
      Handler: src.expand.app.lambda_handler
      Environment:
        Variables:
          # ExpandFunction now also reads a saved profile override before falling back to the
          # fixture (see common/dynamo.py) -- without this, PROFILE_TABLE_NAME would resolve to
          # config.py's local-dev default, miss every lookup, and silently always use the fixture.
          PROFILE_TABLE_NAME: !Ref ProfileTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Region hardcoded to match src/common/config.py's AWS_REGION — this stack must be
                # deployed to us-east-1. Using ${AWS::Region} here would silently break if ever
                # deployed elsewhere: the Lambda would still call Bedrock in us-east-1 (per config.py)
                # while this policy would only grant access in the deploy region.
                - !Sub "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                # Underlying foundation model, wildcarded across regions: AWS requires IAM permission
                # on the foundation model in every region a cross-region profile might route to, not
                # just the invoking region.
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ProfileTable.Arn
      Events:
        Expand:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /expand
            Method: post

  SimplifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build
      Handler: src.simplify.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Same policy as ExpandFunction (identical model/account/region constraints).
                # Globals.Function does not support Policies (checked against AWS's SAM Globals
                # reference), so this has to be duplicated rather than hoisted up.
                - !Sub "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
      Events:
        Simplify:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /simplify
            Method: post

  SpeakFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build
      Handler: src.speak.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              # Polly has no per-voice/per-request ARNs to scope to (unlike Bedrock's
              # inference-profile/foundation-model ARNs above) -- "*" is the standard/expected
              # scope for polly:SynthesizeSpeech.
              Resource: "*"
      Events:
        Speak:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /speak
            Method: post

  ContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build
      Handler: src.context.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Same policy as SimplifyFunction (identical model/account/region constraints).
                - !Sub "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
      Events:
        UpdateContext:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /context/update
            Method: post

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build
      Handler: src.profile.app.lambda_handler
      Environment:
        Variables:
          PROFILE_TABLE_NAME: !Ref ProfileTable
      Policies:
        # Explicit least-privilege statement rather than DynamoDBCrudPolicy, which also grants
        # Scan/Query/UpdateItem/DeleteItem/BatchWrite that this endpoint never uses.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileTable.Arn
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /profile/{id}
            Method: get
        PutProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BridgeApi
            Path: /profile/{id}
            Method: post

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  GateFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-gate"
      AutoPublish: true
      FunctionConfig:
        Comment: Basic-auth gate + /api/* prefix strip
        Runtime: cloudfront-js-2.0
      FunctionCode:
        Fn::Sub:
          - |
            function handler(event) {
              var request = event.request;
              var auth = request.headers.authorization;
              if (!auth || auth.value !== 'Basic ${AuthToken}') {
                return {
                  statusCode: 401,
                  statusDescription: 'Unauthorized',
                  headers: { 'www-authenticate': { value: 'Basic realm="Pebble"' } }
                };
              }
              if (request.uri.startsWith('/api/')) {
                request.uri = request.uri.substring(4);
              }
              return request;
            }
          - AuthToken:
              Fn::Base64: !Sub "${SiteUsername}:${SitePassword}"

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${BridgeApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /dev
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
            OriginCustomHeaders:
              - HeaderName: X-Pebble-Origin
                HeaderValue: !Ref ApiOriginSecret
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt GateFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt GateFunction.FunctionARN

Outputs:
  SiteUrl:
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  ApiUrl:
    Value: !Sub "https://${BridgeApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
